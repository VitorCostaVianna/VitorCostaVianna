<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Caveat:wght@400;600&amp;display=swap');
      .name { font-family: 'Permanent Marker', cursive; fill: #2dd4a7; }
      .role { font-family: 'Caveat', cursive; font-weight: 600; fill: #9ca3af; }
      .tag  { font-family: 'Caveat', cursive; font-weight: 600; fill: #f5f5f5; }
    </style>
  </defs>
  <rect width="1000" height="260" fill="#0d1117"/>
